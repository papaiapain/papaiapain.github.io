# noteに連載の新しい回が出たら、ホームページのカードを1枚足す。
# 1時間おきにギットハブの側で動くので、パソコンの電源が切れていても動く。
name: noteの新しい回を足す

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-series
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: noteの新着を見てカードを足す
        run: python3 tools/update_series.py

      - name: 変わっていたら送って、ページを作り直してもらう
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "新しい回は無い"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "noteの新しい回をホームページに足す（自動）"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
